<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a6508">
<title>Divine Harmony Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);--bg:#fbfaf6;--card:#fff;--ink:#241c0c;--mut:#6f6550;--gold:#8a6508;--on:#fff;--line:#e2d8bd;--soft:#f4efe0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120a;--card:#1f1a0f;--ink:#f3ecd8;--mut:#b5a982;--gold:#e2b43c;--on:#1a1405;--line:#3b3320;--soft:#2a2314}}
:root[data-theme="dark"]{--bg:#16120a;--card:#1f1a0f;--ink:#f3ecd8;--mut:#b5a982;--gold:#e2b43c;--on:#1a1405;--line:#3b3320;--soft:#2a2314}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
[hidden]{display:none!important}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;margin:0;color:var(--gold)}
h1{font-size:32px;text-align:center;margin:8px 0 18px}
h2{font-size:28px;margin:6px 0 14px}
h3{font-size:15px;margin:22px 0 8px;color:var(--gold);font-weight:700}
.logo{display:block;width:140px;margin:6px auto 0;border-radius:6px}
.pick{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:16px;margin:0 0 12px;font:inherit;cursor:pointer}
.pick b{display:block;font-size:19px}.pick span{color:var(--mut);font-size:14px}
.pick:active{background:var(--soft)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.r{display:flex;gap:10px}.r>*{flex:1}
.ins{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--card)}
.ins .ck{display:flex;align-items:center;gap:10px;margin:0;color:var(--ink);font-size:16px}
.ins .ck input{width:20px;height:20px;accent-color:var(--gold)}
.ins .ib{margin-top:8px}
.ins .ib label{margin-top:0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);color:var(--on);font:inherit;font-weight:700;margin-top:22px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--gold);border:1px solid var(--gold);margin-top:10px}
.link{background:none;border:0;color:var(--gold);font:inherit;padding:6px 0;cursor:pointer}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--gold);margin-top:20px;padding-top:10px;font-weight:700;font-size:18px}
.tot span:last-child{color:var(--gold);font-size:22px}
.err{color:#b3261e;margin-top:12px;font-size:14px}
.ok{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px}
</style></head><body><div class="wrap">

<h1>What do you need?</h1>
<button class="pick" data-t="inv"><b>Invoice</b><span>Full price breakdown, advance terms and bank details</span></button>
<button class="pick" data-t="quo"><b>Quotation</b><span>Same layout as an invoice, titled Quotation</span></button>
<button class="pick" data-t="adv"><b>Advance payment acknowledgement</b><span>Receipt that confirms the booking</span></button>
</section>

<section id="form" hidden>
<button class="link" id="back">‹ Change document type</button>
<h2 id="ftitle"></h2>

<h3>Document</h3>
<div class="r"><div><label for="dn">Number</label><input id="dn"></div><div><label for="dd">Date</label><input id="dd" type="date"></div></div>

<h3>Client</h3>
<label for="cn">Client name</label><input id="cn" autocomplete="off">
<label for="cp">Contact number</label><input id="cp" type="tel">

<h3>Function</h3>
<label for="ft">Function type</label>
<select id="ft"><option>Christmas carol</option><option>Church Wedding Choir</option><option>Corporate function</option><option>Wedding Reception</option><option>Other</option></select>
<div id="fob" hidden><label for="fo">Function type (other)</label><input id="fo"></div>
<div class="r"><div><label for="dt">Function date</label><input id="dt" type="date"></div><div><label for="loc">Location</label><input id="loc"></div></div>
<label for="req">Special requests</label><textarea id="req" rows="2"></textarea>

<h3>Choir</h3>
<div class="r"><div><label for="mem">Number of choir members</label><input id="mem" type="number" inputmode="numeric" min="1"></div><div><label for="mamt">Total amount (LKR)</label><input id="mamt" type="number" inputmode="decimal" min="0"></div></div>

<h3>Sound</h3>
<label for="snd">Sound setup and technician provided?</label>
<select id="snd"><option>Yes</option><option>No</option></select>

<h3>Instruments</h3>
<div id="ins"></div>

<h3>Other charges</h3>
<label for="tr">Transport fee?</label><select id="tr"><option>No</option><option>Yes</option></select>
<div id="trb" hidden><label for="tra">Transport cost (LKR)</label><input id="tra" type="number" inputmode="decimal" min="0"></div>
<label for="of">Any other fees?</label><select id="of"><option>No</option><option>Yes</option></select>
<div id="ofb" hidden class="r"><div><label for="ofd">Description</label><input id="ofd"></div><div><label for="ofa">Amount (LKR)</label><input id="ofa" type="number" inputmode="decimal" min="0"></div></div>

<div id="advb" hidden>
<h3>Advance payment</h3>
<div class="r"><div><label for="pa">Advance paid (LKR)</label><input id="pa" type="number" inputmode="decimal" min="0"></div><div><label for="pd">Payment date</label><input id="pd" type="date"></div></div>
</div>

<div class="tot"><span id="tl">Total Amount</span><span id="tv">Rs. 0.00</span></div>
<div class="err" id="err" role="alert"></div>
<button class="btn" id="gen">Create PDF</button>

<div class="ok" id="done" hidden>
<div id="dmsg"></div>
<button class="btn" id="save">Save PDF</button>
<button class="btn alt" id="share">Share PDF</button>
</div>
</section>
</div><div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const TT={inv:["Invoice","INVOICE"],quo:["Quotation","QUOTATION"],adv:["Advance payment acknowledgement","ADVANCE PAYMENT RECEIPT"]};
const INS=[["Keyboard","free"],["Violinist"],["Cello"],["Flute"],["Classic guitar"],["Other","o"]];
let type="",cur=null;
$("#ins").innerHTML=INS.map(([n,f])=>`<div class="ins" data-n="${n}" data-f="${f||""}"><label class="ck"><input type="checkbox"> ${n==="Other"?"Other instrument":n}${f==="free"?" (free)":""}</label><div class="ib" hidden>${f==="o"?'<label>Instrument name</label><input class="nm">':""}<div class="r"><div><label>Count</label><input class="cnt" type="number" inputmode="numeric" min="1" value="1"></div>${f==="free"?"":'<div><label>Price per person (LKR)</label><input class="pr" type="number" inputmode="decimal" min="0"></div>'}</div></div></div>`).join("");
const money=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=id=>parseFloat($(id).value)||0;
const p2=n=>String(n).padStart(2,"0");
const dmy=iso=>{if(!iso)return"";const[a,b,c]=iso.split("-");return`${c}.${b}.${a}`};
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function longDate(iso){if(!iso)return"";const[a,b,c]=iso.split("-").map(Number);const s=(c%10===1&&c!==11)?"st":(c%10===2&&c!==12)?"nd":(c%10===3&&c!==13)?"rd":"th";return`${c}${s} ${MN[b-1]} ${a}`}
const today=()=>{const t=new Date();return`${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`};
function nextNo(){const t=new Date(),k=`${String(t.getFullYear()).slice(2)}${p2(t.getMonth()+1)}`;let c=0;try{c=+(JSON.parse(localStorage.getItem("dhseq")||"{}")[k]||0)}catch(e){}return`DH${k.slice(0,2)}/${k.slice(2)}/${String(c+1).padStart(3,"0")}`}
function bump(){const t=new Date(),k=`${String(t.getFullYear()).slice(2)}${p2(t.getMonth()+1)}`;try{const o=JSON.parse(localStorage.getItem("dhseq")||"{}");o[k]=(+o[k]||0)+1;localStorage.setItem("dhseq",JSON.stringify(o))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

function items(){
 const mem=num("#mem"),L=[{d:`Choir (${mem||0} member${mem===1?"":"s"})`,a:num("#mamt")}];
 if($("#snd").value==="Yes")L.push({d:"Sound setup and professional technician",a:null});
 $$(".ins").forEach(r=>{if(!r.querySelector("input[type=checkbox]").checked)return;
  const c=Math.max(1,parseInt(r.querySelector(".cnt").value)||1),f=r.dataset.f;
  let n=f==="o"?(r.querySelector(".nm").value.trim()||"Other instrument"):r.dataset.n;
  if(f==="free")L.push({d:`${c} × ${n}`,a:null});
  else{const p=parseFloat(r.querySelector(".pr").value)||0;L.push({d:`${c} × ${n}${c>1?` (Rs. ${money(p)} each)`:""}`,a:c*p})}});
 if($("#tr").value==="Yes")L.push({d:"Transport",a:num("#tra")});
 if($("#of").value==="Yes")L.push({d:$("#ofd").value.trim()||"Other fees",a:num("#ofa")});
 return L}
const total=()=>items().reduce((s,i)=>s+(i.a||0),0);
function sync(){$("#fob").hidden=$("#ft").value!=="Other";$("#trb").hidden=$("#tr").value!=="Yes";$("#ofb").hidden=$("#of").value!=="Yes";
 $$(".ins").forEach(r=>r.querySelector(".ib").hidden=!r.querySelector("input[type=checkbox]").checked);
 $("#tl").textContent=type==="adv"?"Total Invoice Value":"Total Amount";$("#tv").textContent="Rs. "+money(total())}
$("#form").addEventListener("input",()=>{sync();$("#done").hidden=true});
$("#form").addEventListener("change",()=>{sync()});

function make(){
 let r;for(const S of [1,.93,.86,.8,.74,.68]){r=makeDoc(S);if(r.pages===1)break}
 const name=`${type==="adv"?"Advance_Receipt":r.word}_${r.N.cn||"Client"}_${r.N.dn}`.replace(/[^\w\-]+/g,"_")+".pdf";
 return{blob:r.d.output("blob"),name,tot:r.tot,N:r.N}}

$("#gen").onclick=()=>{
 const e=$("#err");e.textContent="";
 if(!$("#cn").value.trim())return e.textContent="Enter the client name.";
 if(!num("#mamt"))return e.textContent="Enter the total amount for the choir.";
 if(type==="adv"&&(!num("#pa")||!$("#pd").value))return e.textContent="Enter the advance paid and the payment date.";
 if(!window.jspdf)return e.textContent="The PDF library did not load. Check your connection and try again.";
 try{cur=make();bump()}catch(x){return e.textContent="Could not create the PDF: "+x.message}
 $("#dmsg").textContent=`${TT[type][0]} ${cur.N.dn} for ${cur.N.cn} is ready (Rs. ${money(cur.tot)}).`;$("#done").hidden=false;$("#done").scrollIntoView({behavior:"smooth",block:"center"})};
$("#save").onclick=async()=>{
 try{const dl=window.claude&&await claude.use("downloads");if(dl){await dl.save({filename:cur.name,data:cur.blob});return toast("PDF saved")}}catch(x){if(x&&x.code==="declined")return;if(x&&x.code==="host_unavailable")return toast("Open this page in your browser to save the PDF")}
 const a=document.createElement("a");a.href=URL.createObjectURL(cur.blob);a.download=cur.name;document.body.appendChild(a);a.click();a.remove()};
$("#share").onclick=()=>{const f=new File([cur.blob],cur.name,{type:"application/pdf"});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:cur.name}).catch(()=>{});else toast("Sharing is not available here. Use Save PDF.")};
</script></body></html>
